name: Check Airtel Gateway

on:
  push:
    paths:
      - 'airtel-gateway/**'
      - '.github/workflows/airtel-gateway-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airtel-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: airtel-gateway/package.json
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: node --check server.js
      - name: Start gateway in dry-run mode
        env:
          PORT: 8080
          DRY_RUN: 'true'
          GATEWAY_SHARED_SECRET: 'ci-only-secret-not-used-in-production-1234567890'
        run: |
          node server.js > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid
          sleep 2
          curl --fail http://127.0.0.1:8080/health
          kill $(cat /tmp/gateway.pid)
