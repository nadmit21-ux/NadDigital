name: Deploy Airtel Gateway

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airtel-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify required GitHub secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
        run: |
          test -n "$FLY_API_TOKEN" || (echo "Missing FLY_API_TOKEN" && exit 1)
          test -n "$FLY_APP_NAME" || (echo "Missing FLY_APP_NAME" && exit 1)

      - name: Deploy gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
        run: flyctl deploy --remote-only --app "$FLY_APP_NAME"

      - name: Show application status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
        run: flyctl status --app "$FLY_APP_NAME"
