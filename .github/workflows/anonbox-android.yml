name: Build AnonBox APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/anonbox-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AnonBox.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnonBox-APK
          path: AnonBox.apk
          if-no-files-found: error

      - name: Publish stable APK link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view anonbox-latest >/dev/null 2>&1; then
            gh release upload anonbox-latest AnonBox.apk --clobber
            gh release edit anonbox-latest --title "AnonBox Android — dernière version" --notes "APK Android de test AnonBox. Le fichier est automatiquement remplacé à chaque compilation réussie."
          else
            gh release create anonbox-latest AnonBox.apk --title "AnonBox Android — dernière version" --notes "APK Android de test AnonBox. Le fichier est automatiquement remplacé à chaque compilation réussie."
          fi
