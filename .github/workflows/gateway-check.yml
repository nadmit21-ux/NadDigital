name: Check Airtel Gateway

on:
  push:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check gateway/server.mjs
      - name: Build Docker image
        run: docker build -t naddigital-airtel-gateway ./gateway
