name: Build NadDigital

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production site
        run: npm run build

      - name: Upload compiled site
        uses: actions/upload-artifact@v4
        with:
          name: naddigital-dist
          path: dist/
          if-no-files-found: error
