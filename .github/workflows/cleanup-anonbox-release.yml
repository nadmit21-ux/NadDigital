name: Cleanup misplaced AnonBox release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-anonbox-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove AnonBox release and tag from NadDigital
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete anonbox-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
